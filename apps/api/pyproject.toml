[project]
name = "quotient-api"
version = "0.1.0"
description = "Quotient MCP server (protocol 2025-11-25, Streamable HTTP)."
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
quotient-api = "quotient.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quotient*"]

# Motivation vs Logic
# Motivation: Pin the commitment lens so it cannot read another dimension's prose.
# Logic: The fill stage emits findings that cite supported claims, or none_in_transcript.
id: meeting.lens_commitment.v1
version: 1
model_role: slm
schema: meeting.lens_commitment.v1
cache_breakpoints:
  - name: stable_prefix
    after:
      - system
      - tools
      - schema
    mode: explicit
    ttl: 30m
stages:
  - id: reason
    output: text
  - id: fill
    output: schema
tools:
  - name: open_span
    description: Return one span in this meeting by id, including raw_text, text, start_ms, and end_ms.
    parameters:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required:
        - span_id
      properties:
        span_id:
          type: string
          minLength: 1
input:
  include:
    - supported_claims
  exclude:
    - other_lens_prose
    - raw_transcript
body: |
  The stable prefix is this text, the tools block, and schema meeting.lens_commitment.v1. One cache breakpoint follows that prefix. The user message after the breakpoint carries only the input.include fields. Do not ask for a field listed in input.exclude.

  You write the commitment lens for this meeting.

  You see supported claims and you may open spans in this meeting during the reason stage. You are not shown prose from any other dimension.

  When you emit findings, also emit proposed actions from those findings. acceptance is proposed. There is no owner string. owner_span_id is a span id or null. Null means an owner was not stated. agreement_span_id is the span where agreement was stated, or null. A suggestion with a null agreement span stays proposed.

  due_kind absolute stores an ISO date in due_surface only when the quote itself contains that date, and due_span_id cites that quote. due_kind relative stores the spoken phrase, such as by next Friday, and does not store an ISO date. due_kind none leaves due_surface and due_span_id null.

  Do not mark an action accepted.

  stance is supports, conflicts, or unknown. Cite claim ids of supported claims only. If you have nothing to say, emit none_in_transcript and no findings.

  Do not write a synthesis sentence.

  Reason in free text first. Do not emit JSON on that pass.

  On the fill pass, emit one JSON object that validates against the schema. No markdown fence. Use only the reason trace. A truncated object is invalid. Do not splice a partial object.

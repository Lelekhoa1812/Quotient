# Motivation vs Logic
# Motivation: Pin Sol's coverage resolution so each uncovered speech span becomes a claim or an omission.
# Logic: A claim re-enters counterevidence and entailment. An omission stores the auditor reason. Neither is support.
id: meeting.supplement.v1
version: 1
model_role: llm
schema: meeting.supplement.v1
cache_breakpoints:
  - name: stable_prefix
    after:
      - system
      - tools
      - schema
    mode: explicit
    ttl: 30m
stages:
  - id: reason
    output: text
  - id: fill
    output: schema
tools:
  - name: open_span
    description: Return one span in this meeting by id, including raw_text, text, start_ms, and end_ms.
    parameters:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required:
        - span_id
      properties:
        span_id:
          type: string
          minLength: 1
input:
  include:
    - uncovered_spans
  exclude:
    - draft_brief
    - synthesis
body: |
  The stable prefix is this text, the tools block, and schema meeting.supplement.v1. One cache breakpoint follows that prefix. The user message after the breakpoint carries only the input.include fields. Do not ask for a field listed in input.exclude.

  Close each uncovered speech span with a claim or an omission.
  A claim re-enters counterevidence and entailment. It is not supported in this call.
  The claim is one decontextualized proposition, a verbatim quote from that span, a kind, and decision_status or null.
  Do not emit character offsets. Do not emit an owner string.
  An omission names that span and the reason it stays out of the brief. Use it when the span states nothing that can be one atomic proposition.
  Do not leave a span out of both outcomes. Do not write a synthesis sentence.
  Open spans during the reason stage. The fill stage only records the result.

  Reason in free text first. Do not emit JSON on that pass.

  On the fill pass, emit one JSON object that validates against the schema. No markdown fence. Use only the reason trace. A truncated object is invalid. Do not splice a partial object.

# Motivation vs Logic
# Motivation: A Pegasus part must return one complete observations object at the vendor output maximum.
# Logic: Local part times become cited observations. A sentence with no time range is a note. Truncation fails the call.
id: meeting.pegasus.v1
version: 1
model_role: pegasus
schema: meeting.pegasus.v1
cache_breakpoints:
  - name: stable_prefix
    after:
      - system
      - tools
      - schema
    mode: explicit
    ttl: 30m
stages:
  - id: reason
    output: text
  - id: fill
    output: schema
tools: []
input:
  include:
    - video_part
  exclude:
    - char_offsets
    - partial_json
body: |
  The stable prefix is this text, the tools block, and schema meeting.pegasus.v1. One cache breakpoint follows that prefix. The user message after the breakpoint carries only the input.include fields. Do not ask for a field listed in input.exclude.

  You are watching a short window of a recorded meeting. Describe what happens on screen over time, as one JSON object. All times are milliseconds from the start of this window.

  observations: what is visible and what changes: who is on camera, what is shown or shared, what is pointed at, drawn, clicked or typed, a gesture that carries meaning, a person joining or leaving. Each has a statement and, whenever you know it, start_ms and end_ms; the times must be the moment the thing happens inside this window, never the start of the window by default. A statement with no time range cannot support a claim: put that statement in notes.

  Describe only what you can actually see. Never invent: no placeholder names or data (John Doe, Jane Smith, lorem ipsum), no text you cannot read, no contents of a table or page you cannot make out. If a screen is too small or blurred to read, say that it is shown and unreadable. Reading text, names and figures is done on separate frames, so do not try to transcribe them here; describe the activity.
  The inputPrompt budget is the vendor maximum of 2000 tokens.
  maxOutputTokens stays at the vendor maximum of 4096.
  Do not emit character offsets. Quote resolution stays in code.

  Emit one JSON object that validates against the schema. No markdown fence. A truncated object is invalid. Do not splice a partial object.

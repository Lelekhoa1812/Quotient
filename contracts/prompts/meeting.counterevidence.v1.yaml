# Motivation vs Logic
# Motivation: Pin the contradicting-span search to Luna and require the opened span ids in the schema.
# Logic: searched_ids is non-empty. The finding is a verbatim contradicting quote or an explicit empty result.
id: meeting.counterevidence.v1
version: 1
model_role: slm
schema: meeting.counterevidence.v1
cache_breakpoints:
  - name: stable_prefix
    after:
      - system
      - tools
      - schema
    mode: explicit
    ttl: 30m
stages:
  - id: reason
    output: text
  - id: fill
    output: schema
tools:
  - name: open_span
    description: Return one span in this meeting by id, including raw_text, text, start_ms, and end_ms.
    parameters:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required:
        - span_id
      properties:
        span_id:
          type: string
          minLength: 1
input:
  include:
    - claim
  exclude:
    - draft_brief
    - synthesis
body: |
  The stable prefix is this text, the tools block, and schema meeting.counterevidence.v1. One cache breakpoint follows that prefix. The user message after the breakpoint carries only the input.include fields. Do not ask for a field listed in input.exclude.

  Search this meeting for a span that contradicts one claim.
  Open spans during the reason stage. The fill stage only records the result.
  Record every span id you open in searched_ids. An empty searched_ids list is invalid and fails the claim closed.
  Span ids must belong to this meeting.
  Return either a contradicting verbatim quote and its span id, or an explicit empty finding.
  Do not treat neutral wording as a contradiction. Do not rewrite the claim into agreement.
  Do not emit character offsets.

  Reason in free text first. Do not emit JSON on that pass.

  On the fill pass, emit one JSON object that validates against the schema. No markdown fence. Use only the reason trace. A truncated object is invalid. Do not splice a partial object.
